apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-server
  namespace: webapp
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-server
  template:
    metadata:
      labels:
        app: gateway-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # config/discovery-server와 동일하게 앱 박스 노드에 고정 - hostPort로 그 호스트 자체
      # 주소에서 Caddy(같은 박스, compose 컨테이너)가 그대로 접근 가능해야 한다.
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-0-81.ap-northeast-2.compute.internal
      # 9개 business-service는 아직 docker-compose에 있다 - Eureka에는 서비스명으로 등록되지만
      # (#198 Phase 4) 그 이름을 k8s 파드가 풀 수 있는 방법이 없어(다른 네트워크 네임스페이스)
      # hostAliases로 앱 박스 자신의 IP에 직접 매핑한다. 서비스가 하나씩 k8s로 옮겨갈 때마다
      # 여기서 한 줄씩 지우면 된다 - 이 목록이 곧 남은 마이그레이션 체크리스트.
      hostAliases:
        - ip: "10.0.0.81"
          hostnames:
            - order-service
            - project-service
            - payment-service
            - user-service
            - cart-service
            - settlement-service
            - file-service
            - board-service
            - notification-service
            # ai-service는 넣지 않는다 - 같은 클러스터 안이므로 k8s DNS로 풀려야 한다
            # (hostAliases는 /etc/hosts라 DNS보다 우선하므로 넣으면 오히려 깨진다).
      containers:
        - name: gateway-server
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-gateway-server:latest
          ports:
            - containerPort: 8000
              hostPort: 8000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            # user-service(발급)와 반드시 같은 값이어야 한다 (#164) - user-service는 아직
            # compose에 있고 앱 박스 .env에서 값을 받는다. 이 Secret과 수동으로 동기화 필요
            # (CD 연동 이후엔 #198 Phase 6에서 자동 재적용).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt
                  key: JWT_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              memory: 320Mi
              cpu: 200m
            limits:
              memory: 448Mi   # 기존 compose mem_limit과 동일
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-server
  namespace: webapp
spec:
  type: ClusterIP
  selector:
    app: gateway-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
