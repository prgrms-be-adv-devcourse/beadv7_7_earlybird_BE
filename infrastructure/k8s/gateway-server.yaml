apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-server
  namespace: webapp
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-server
  template:
    metadata:
      labels:
        app: gateway-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # config/discovery-server와 동일하게 앱 박스 노드에 고정 - hostPort로 그 호스트 자체
      # 주소에서 Caddy(같은 박스, compose 컨테이너)가 그대로 접근 가능해야 한다.
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-0-81.ap-northeast-2.compute.internal
      # #198 완료 (2026-08-14): 12개 business-service 전부 k8s로 이전됨 - hostAliases로
      # 앱 박스 IP에 직접 매핑해야 했던 남은 compose 서비스가 더 이상 없다(이 목록이 곧
      # 남은 마이그레이션 체크리스트였다). 전부 이제 k8s Service DNS로 풀린다.
      containers:
        - name: gateway-server
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-gateway-server:latest
          ports:
            - containerPort: 8000
              hostPort: 8000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            # user-service(발급)와 반드시 같은 값이어야 한다 (#164) - user-service도 이제 이
            # Secret을 그대로 읽으므로(#198 batch 2) 수동 동기화가 필요 없다.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt
                  key: JWT_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              memory: 320Mi
              cpu: 200m
            limits:
              memory: 448Mi   # 기존 compose mem_limit과 동일
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-server
  namespace: webapp
spec:
  type: ClusterIP
  selector:
    app: gateway-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
