apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-0-81.ap-northeast-2.compute.internal
      # preStop(5s) + graceful shutdown(20s, chat-service.yml) 여유를 두기 위해 기본 30s에서 상향 (#330).
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chat-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-chat-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-openai
                  key: OPENAI_API_KEY
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              memory: 312Mi
              cpu: 100m
            limits:
              memory: 416Mi   # #340 - 앱 박스 실측(crictl stats) 309.6MiB * 1.3 여유, 다른 서비스와 동일하게 32Mi 단위로 반올림
          ports:
            - containerPort: 8090
          # SIGTERM 전에 이 pod를 kube-proxy 라우팅에서 뺄 시간을 번다 - readinessProbe가
          # Not Ready로 잡기까지, 그리고 그 상태가 iptables에 반영되기까지의 경합 구간(#330 재검증에서
          # 137/139 성공, 2건 드랍으로 실측)을 메우기 위함.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            periodSeconds: 20
            timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: webapp
spec:
  selector:
    app: chat-service
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service
  namespace: webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
