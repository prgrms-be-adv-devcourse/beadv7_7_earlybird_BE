apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-service
  namespace: webapp
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: board-service
  template:
    metadata:
      labels:
        app: board-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-0-81.ap-northeast-2.compute.internal
      containers:
        - name: board-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-board-service:latest
          ports:
            - containerPort: 8088
              hostPort: 8088
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            # 리뷰 생성 알림 메일(Gmail SMTP) - 비어있어도 기동은 막지 않지만(board-service.yml의
            # ":" 기본값) 실제 메일 발송은 실패한다. 프로덕션 값 그대로 주입.
            - name: GMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: board-gmail
                  key: GMAIL_USERNAME
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: board-gmail
                  key: GMAIL_APP_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              memory: 480Mi
              cpu: 100m
            limits:
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            periodSeconds: 20
            timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: board-service
  namespace: webapp
spec:
  type: ClusterIP
  selector:
    app: board-service
  ports:
    - name: http
      port: 8088
      targetPort: 8088
