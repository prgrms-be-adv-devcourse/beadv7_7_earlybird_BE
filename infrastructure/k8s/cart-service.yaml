apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: webapp
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-0-81.ap-northeast-2.compute.internal
      containers:
        - name: cart-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-cart-service:latest
          ports:
            - containerPort: 8085
              hostPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              memory: 504Mi
              cpu: 100m
            limits:
              memory: 672Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 20
            timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: webapp
spec:
  type: ClusterIP
  selector:
    app: cart-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
