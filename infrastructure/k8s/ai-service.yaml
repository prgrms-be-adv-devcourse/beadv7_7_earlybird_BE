apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ai-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-ai-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-openai
                  key: OPENAI_API_KEY
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70"
          resources:
            requests:
              memory: 312Mi
              cpu: 100m
            limits:
              memory: 416Mi   # #340 - 앱 박스 실측(crictl stats) 309.6MiB * 1.3 여유, 다른 서비스와 동일하게 32Mi 단위로 반올림
          ports:
            - containerPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: webapp
spec:
  selector:
    app: ai-service
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service
  namespace: webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
