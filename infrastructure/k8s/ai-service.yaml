apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ai-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-ai-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          ports:
            - containerPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: webapp
spec:
  selector:
    app: ai-service
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
