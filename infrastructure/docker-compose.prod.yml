# AWS-only override, layered on top of docker-compose.yml via `-f docker-compose.yml -f docker-compose.prod.yml`.
# Local dev never passes this file, so it keeps the default 8000:8000 mapping and local `build:`
# behavior unchanged.
#
# Caddy is now the sole external entry point (terminates TLS on 80/443, per the EC2 security
# group). gateway-server no longer publishes anything to the host - same "only reach it through
# the front door" rule docker-compose.yml already applies to every business service, now applied
# to gateway-server too since Caddy is the new front door. Caddy still reaches it by service name
# over the Compose network without any host port published.
#
# #198 완료 (2026-08-14): 12개 business-service(gateway/config/discovery/file-service 포함)
# 전부 k8s로 이전됨. 이 파일에는 이제 앱 박스에서 compose로 뜨는 business-service가 하나도
# 없다 - 아래는 전부 `profiles: ["local-only"]`로 compose 기본 `up -d` 대상에서 빼는 한 줄씩뿐.
# kafka(base 파일, 이 오버라이드 대상 아님)/caddy/fe만 실제로 compose가 관리한다.
services:
  # mysql/elasticsearch는 #256으로 2번째 EC2(데이터 박스)로 분리됐다 - 앱 박스에서는 더 이상
  # 로컬 컨테이너로 띄우지 않는다. base 파일(docker-compose.yml)의 정의 자체는 로컬 개발용으로
  # 그대로 두고, 여기서는 활성화되지 않는 profile을 붙여서 이 -f 조합의 기본 `up -d`(어떤
  # --profile도 넘기지 않음) 대상에서만 빠지게 한다.
  mysql:
    profiles: ["local-only"]

  elasticsearch:
    profiles: ["local-only"]

  # #198 Phase 3 - k8s(앱 박스 nodeSelector 고정, hostPort:8888)로 이전 완료. discovery-server와
  # 동일 패턴 - compose 기본 `up -d` 대상에서 제외.
  config-server:
    profiles: ["local-only"]

  # #198 Phase 2 - k8s(앱 박스 nodeSelector 고정, hostPort:8761)로 이전 완료. compose 기본
  # `up -d`(--profile 없음) 대상에서 제외 - mysql/elasticsearch(#256)와 동일 패턴.
  discovery-server:
    profiles: ["local-only"]

  # #198 Phase 5 - k8s(앱 박스 nodeSelector 고정, hostPort:8000)로 이전 완료. discovery-server/
  # config-server와 동일 패턴 - compose 기본 `up -d` 대상에서 제외.
  gateway-server:
    profiles: ["local-only"]

  # #198 batch 3 - k8s(앱 박스 nodeSelector 고정, hostPort로 노출)로 이전 완료. 나머지와
  # 동일 패턴 - compose 기본 `up -d` 대상에서 제외. 이걸로 12개 business-service 전부 k8s로
  # 이전됨.
  order-service:
    profiles: ["local-only"]

  project-service:
    profiles: ["local-only"]

  payment-service:
    profiles: ["local-only"]

  # #198 batch 2 - k8s(앱 박스 nodeSelector 고정, hostPort:8083)로 이전 완료.
  user-service:
    profiles: ["local-only"]

  cart-service:
    profiles: ["local-only"]

  settlement-service:
    profiles: ["local-only"]

  # #198 나머지 9개 서비스 마이그레이션 파일럿 - k8s(앱 박스 nodeSelector 고정, hostPort:8087)로
  # 이전 완료. core-three와 동일 패턴 - compose 기본 `up -d` 대상에서 제외.
  file-service:
    profiles: ["local-only"]

  board-service:
    profiles: ["local-only"]

  notification-service:
    profiles: ["local-only"]

  caddy:
    image: caddy:2
    container_name: earlybird-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # gateway-server가 profile로 빠지면서 list 문법(- gateway-server)은 "depends on undefined
    # service" 에러를 낸다 - map 문법 + required: false로 전환 (다른 9개 서비스와 동일한 이유).
    # Caddy는 어차피 gateway-server를 컴포즈 서비스명이 아니라 IP(Caddyfile 참고)로 직접 찾아가므로
    # 기동 순서 자체도 더 이상 의미 없다.
    depends_on:
      gateway-server:
        condition: service_started
        required: false
      fe:
        condition: service_started
    restart: unless-stopped

  # Built and pushed by beadv7_7_earlybird_FE's own GitHub Actions (ghcr.io, tagged :latest and
  # by commit SHA). Its deploy workflow SSHes in and runs `docker compose pull fe && up -d fe`
  # against this file. Caddy reverse-proxies everything but /api/* to it - see Caddyfile.
  fe:
    image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_fe:latest
    container_name: earlybird-fe
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
