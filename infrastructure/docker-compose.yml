    # 를 그대로 반복한다 - mem_limit/JAVA_TOOL_OPTIONS 값 근거는 order-service 주석 참고 (#272).
    # 오늘 docker stats 실측 504.5MiB * 1.3 여유 → 672m 로 반올림.
    environment:
      # docker-local 근거는 order-service 주석 참고.
