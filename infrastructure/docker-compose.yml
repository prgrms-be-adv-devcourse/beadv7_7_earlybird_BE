    container_name: earlybird-board-service
    # service-defaults 의 environment 는 map 이라 <<: 병합이 아니라 완전히 덮어써진다 — 그래서 여기선
    # SPRING_PROFILES_ACTIVE 를 그대로 반복하고 GMAIL_* 만 추가한다.
    # 값이 없으면(로컬 .env 미설정) 빈 문자열로 들어가고, board-service.yml 의 ":" 기본값이 마저 받아준다.
    environment:
