    #   - "8089:8089"

  ai-service:
    # 아직 자체 DB가 없어 mysql 의존성은 뺀다 (business-depends-on 아님).
    # 로컬 개발 전용(조우진) - image: 오버라이드가 없어 build: 로 정의된 채로 두면 CD의
    # `docker compose ... up -d`(서비스 필터 없음)가 매 배포마다 EC2에서 로컬로 빌드하게 된다.
    # profiles로 기본 up -d 대상에서 제외 - 로컬에서는 `--profile local` 로 명시적으로 켠다.
    profiles: ["local"]
    <<: *service-defaults
    build:
      <<: *build-defaults
      args:
        MODULE: ai-service
    container_name: earlybird-ai-service
    # service-defaults 의 environment 는 map 이라 <<: 병합이 아니라 완전히 덮어써진다 — 그래서 여기선
    # SPRING_PROFILES_ACTIVE 를 그대로 반복하고 OPENAI_API_KEY 만 추가한다.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: *core-depends-on
    # gateway 를 거치지 않고 이 서비스만 직접 curl/swagger 로 찔러볼 때만 주석 해제.
