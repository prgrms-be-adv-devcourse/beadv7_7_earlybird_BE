      # 오늘 docker stats 실측 454.2MiB * 1.3 여유 → 608m 로 반올림.
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      PAYMENT_TOSS_SECRET_KEY: ${PAYMENT_TOSS_SECRET_KEY:-}
      PAYMENT_SECURITY_ENCRYPTION_KEY: ${PAYMENT_SECURITY_ENCRYPTION_KEY}
    mem_limit: 608m
    # gateway 를 거치지 않고 이 서비스만 직접 curl/swagger 로 찔러볼 때만 주석 해제.
    # ports:
    #   - "8082:8082"

  user-service:
    <<: [*service-defaults, *business-depends-on]
    build:
      <<: *build-defaults
      args:
        MODULE: user-service
    container_name: earlybird-user-service
    # service-defaults 의 environment 는 map 이라 <<: 병합이 아니라 완전히 덮어써진다 — 그래서 여기선
    # SPRING_PROFILES_ACTIVE 를 그대로 반복하고 JWT_SECRET 만 추가한다.
    # JWT 발급 키 — gateway-server 와 반드시 같은 값이어야 한다 (#164).
    environment:
      # docker-local 근거는 order-service 주석 참고.
      SPRING_PROFILES_ACTIVE: docker,docker-local
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # service-defaults 의 environment 를 통째로 덮어쓰므로 JAVA_TOOL_OPTIONS 도 그대로 반복한다 -
      # mem_limit/JAVA_TOOL_OPTIONS 값 근거는 order-service 주석 참고 (#272).
      # 오늘 docker stats 실측 442.8MiB * 1.3 여유 → 576m 로 반올림.
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
      JWT_SECRET: ${JWT_SECRET}
    mem_limit: 576m
    # gateway 를 거치지 않고 이 서비스만 직접 curl/swagger 로 찔러볼 때만 주석 해제.
    # ports:
    #   - "8083:8083"

  cart-service:
