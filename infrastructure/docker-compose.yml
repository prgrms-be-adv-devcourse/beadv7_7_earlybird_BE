x-service-defaults: &service-defaults
  environment:
    # 각 서비스 application.yml 이 SPRING_PROFILES_ACTIVE=docker 문서에서 config-server 호스트를
    # 이미 config-server:8888 로 선택한다(spring.config.activate.on-profile) — 별도 env var로
    # spring.config.import 를 다시 덮어쓰지 않는다. 환경변수로 통째로 덮어쓰면 yml 에 박힌 import
    # 선언과 서로 다른 property source 의 "별개" spring.config.import 로 취급되어 둘 다 처리되고,
    # env var 쪽이 성공해도 yml 쪽(localhost:8888)이 컨테이너 안에서 항상 실패해 fail-fast 로
    # 기동이 죽는 문제를 실제로 겪었다 (#192).
    SPRING_PROFILES_ACTIVE: docker
  # logging.file.name(config repo)이 이미 spring.application.name으로 파일명을 구분해주므로,
  # 모든 서비스가 같은 호스트 디렉터리를 공유해도 로그 파일끼리 덮어쓰지 않는다.
  volumes:
    - ./logs:/app/logs
  restart: unless-stopped

# 모든 서비스가 동일한 루트 Dockerfile 을 MODULE 인자만 바꿔 쓴다 (repo 루트 참고).
x-build-defaults: &build-defaults
  context: ..
  dockerfile: Dockerfile

x-core-depends-on: &core-depends-on
  config-server:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

# 비즈니스 서비스/discovery-server 는 호스트에 ports 를 열지 않는다 — gateway-server(:8000) 가
# 유일한 외부 진입점이어야 하고, 컨테이너 간 통신(gateway→service lb://, service→service Feign)은
# ports 매핑 없이도 컴포즈 내부 네트워크 + Eureka 로 이미 동작한다. 호스트에 열어두면 게이트웨이를
# 거치지 않고 누구나 개별 서비스(특히 /internal/** 같은 원래 외부에 안 드러나야 할 엔드포인트)를
# 직접 두드릴 수 있어, gateway-server 를 단일 진입점으로 두는 설계 의도가 깨진다.
# 개별 서비스를 디버깅할 때만 아래 ports 블록의 주석을 풀어 임시로 사용할 것.
x-business-depends-on: &business-depends-on
  depends_on:
    <<: *core-depends-on
    mysql:
      condition: service_healthy

# order/cart/payment/project/settlement 만 kafka를 쓴다 — 나머지 서비스(board/user/file/
# notification)까지 kafka-topics-init 완료를 기다리게 하면 불필요한 결합이 생기므로, 공통
# x-business-depends-on 대신 kafka를 쓰는 서비스에만 이 anchor를 개별로 붙인다.
x-business-depends-on-kafka: &business-depends-on-kafka
  depends_on:
    <<: *core-depends-on
    mysql:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-topics-init:
      condition: service_completed_successfully

services:
  elasticsearch:
    build: ./elasticsearch          # 위 Dockerfile로 빌드 (nori 포함)
    container_name: lecture-es
    environment:
      - discovery.type=single-node  # 로컬 수업용 단일 노드
      - xpack.security.enabled=false # 수업 편의상 보안 끔 (운영에선 절대 금지!)
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  mysql:
    image: mysql:8.4
    container_name: earlybird-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=earlybird       # 애플리케이션 공용 계정 (로컬 개발용)
      - MYSQL_PASSWORD=earlybird
      - TZ=Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      # 최초 기동 시 서비스별 데이터베이스 9개를 생성한다 (볼륨이 이미 있으면 실행되지 않음)
      - ./mysql/init:/docker-entrypoint-initdb.d
      - earlybird-mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # -h 127.0.0.1 (TCP), 절대 localhost 로 바꾸지 말 것: "localhost" 는 유닉스 소켓으로 접속하는데,
      # 첫 기동 시 초기화용 임시 서버가 --skip-networking 상태로 같은 소켓에 떠 있어 healthy 를
      # 오조기 보고한다 (실제 서버가 뜨기 전에 의존 서비스들이 시작해버려 재시작 루프가 발생했음).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: earlybird-kafka
    environment:
      KAFKA_NODE_ID: 1
      # KRaft 모드 — 브로커가 컨트롤러 역할까지 겸한다 (Zookeeper 불필요, 단일 노드 로컬 개발 환경).
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 리스너 4개:
      #  - INTERNAL(29092)  : 컴포즈 네트워크 안의 컨테이너(kafka-ui, 각 서비스 컨테이너)가 접속
      #  - EXTERNAL(9092)   : 호스트에서 직접 실행되는 스프링 앱(./gradlew bootRun)이 localhost:9092 로 접속
      #  - K8S(9094)        : #198 batch 3 - 앱 박스에 nodeSelector로 고정될 k8s 파드(order/cart/
      #                       payment/project/settlement-service)가 접속. k8s 파드는 컴포즈 네트워크
      #                       밖의 별도 네트워크 네임스페이스라 INTERNAL(kafka:29092)도 EXTERNAL
      #                       (localhost:9092)도 못 씀 - 앱 박스 자신의 private IP로 advertise.
      #  - CONTROLLER(9093) : KRaft 내부 통신용
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,K8S://10.0.0.81:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,K8S:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 브로커 1대뿐이므로 내부 토픽들의 복제 계수를 1로 맞춘다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽은 kafka-topics-init(다음 단계)으로만 만든다 — 앱/CLI가 즉석에서 만들어버리면
      # 파티션 수 등 설정이 서비스마다 제각각으로 드리프트될 수 있어 명시적으로 막는다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
      - "9094:9094"
    restart: unless-stopped
    healthcheck:
      # apache/kafka:4.0.0 이미지는 kafka-*.sh 가 PATH 에 없고 /opt/kafka/bin 에만 있다 — full path 필수.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 토픽/파티션/메시지/컨슈머 그룹을 눈으로 확인하는 웹 UI — kibana가 elasticsearch에 대해 하는 역할과 동일.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: earlybird-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # 컴포즈 네트워크 안에서 접속하니 INTERNAL 리스너(29092)를 쓴다 — 호스트용 EXTERNAL(9092)이 아님.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8989:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 토픽을 앱 생명주기와 분리해 한곳에서만 생성한다 (kafka/init-topics.sh).
  # restart 정책을 안 준다 — 한 번 실행하고 끝나는 job이라, 끝난 뒤 재시작되면 안 된다.
  kafka-topics-init:
    image: apache/kafka:4.0.0
    container_name: earlybird-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/sh", "/init-topics.sh"]

  config-server:
    build:
      <<: *build-defaults
      args:
        MODULE: config-server
    container_name: earlybird-config-server
    # 12개 서비스(비즈니스 9개 + config/discovery/gateway) 전체를 -Xms/-Xmx 고정값에서
    # cgroup mem_limit + -XX:MaxRAMPercentage 로 전환 (#272). 기존 방식(#232/#234/#246/#249)은
    # 컨테이너 자체엔 메모리 상한이 없어 힙 바깥(메타스페이스/스레드 스택 등) 사용량을 못 막았고,
    # 트래픽/박스가 바뀔 때마다 docker stats 를 다시 재서 값을 손으로 갱신해야 했다.
    # 이제부터는:
    #   - mem_limit: 오늘 프로덕션 docker stats 실측값에 30% 여유를 얹어 32MiB 단위로 반올림한
    #     "컨테이너 전체" 상한 (cgroup 이 강제 — 넘으면 OOM kill).
    #   - MaxRAMPercentage=70: JDK 10+ 는 컨테이너 인지라 mem_limit 의 70%까지를 힙 상한으로 자동
    #     계산한다. 나머지 30%는 메타스페이스/스레드 스택/코드 캐시/direct buffer 등 힙 외 사용량 몫
    #     — 그동안 관찰된 RES 가 -Xmx 를 넘던 원인(오늘 order-service 만도 534.5MiB RES > -Xmx512m).
    #   - InitialRAMPercentage=35: 기존 -Xms = -Xmx/2 관행을 그대로 유지 (Max 의 절반).
    # 서비스별 mem_limit 만 바꾸면 힙이 비율로 자동 재계산되므로, 이후 박스/트래픽이 바뀌어도
    # #232/#249 때처럼 12개 서비스 값을 전부 손으로 재계산할 필요가 없다.
    environment:
      # 기본값은 native(로컬 파일시스템) — AWS 배포 시 .env 에서 CONFIG_SERVER_PROFILE=production 으로
      # 바꾸면 application.yml 의 GitHub 원격 기본값을 쓴다 (application-production.yml 없음 = 원래 기본값).
      - SPRING_PROFILES_ACTIVE=${CONFIG_SERVER_PROFILE:-native}
      # beadv7_7_earlybird_config(private) 클론용 PAT — production 모드에서만 쓰인다.
      - GIT_USERNAME=${GIT_USERNAME}
      - GIT_PERSONAL_ACCESS_TOKEN=${GIT_PERSONAL_ACCESS_TOKEN}
      # 값 근거는 위 mem_limit 주석 참고 (#272).
      - JAVA_TOOL_OPTIONS=-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
    # 오늘 docker stats 실측 332.1MiB * 1.3 여유 → 448m 로 반올림.
    mem_limit: 448m
    volumes:
      # native 프로파일 전용 — 파일시스템을 그대로 읽기만 하므로(git 체크아웃/리셋 없음) 실제 작업 중인
      # config repo 를 직접 마운트해도 안전하다. 커밋 없이도 수정하면 바로 반영된다.
      - ../../beadv7_7_earlybird_config:/config-repo:ro
      - ./logs:/app/logs
    ports:
      - "8888:8888"
    restart: unless-stopped
    healthcheck:
      # git 저장소 인증/조회까지 확인하는 실제 readiness 체크 (ConfigServerHealthIndicator).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    build:
      <<: *build-defaults
      args:
        MODULE: discovery-server
    container_name: earlybird-discovery-server
    # mem_limit/JAVA_TOOL_OPTIONS 값 근거는 config-server 주석 참고 (#272).
    # 오늘 docker stats 실측 346.5MiB * 1.3 여유 → 480m 로 반올림.
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
    mem_limit: 480m
    volumes:
      - ./logs:/app/logs
    # Eureka 대시보드를 브라우저로 직접 볼 때만 주석 해제.
    # ports:
    #   - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway-server:
    <<: *service-defaults
    build:
      <<: *build-defaults
      args:
        MODULE: gateway-server
    container_name: earlybird-gateway-server
    # service-defaults 의 environment 는 map 이라 <<: 병합이 아니라 완전히 덮어써진다 — 그래서 여기선
    # SPRING_PROFILES_ACTIVE 를 그대로 반복하고 JWT_SECRET 만 추가한다.
    # JWT 검증 키 — user-service 와 반드시 같은 값이어야 한다 (#164).
    # mem_limit/JAVA_TOOL_OPTIONS 값 근거는 config-server 주석 참고 (#272).
    # 오늘 docker stats 실측 340MiB * 1.3 여유 → 448m 로 반올림.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
    mem_limit: 448m
    ports:
      - "8000:8000"
    depends_on: *core-depends-on

  order-service:
    <<: [*service-defaults, *business-depends-on-kafka]
    build:
      <<: *build-defaults
      args:
        MODULE: order-service
    container_name: earlybird-order-service
    # service-defaults 의 environment 는 map 이라 <<: 병합이 아니라 완전히 덮어써지므로, 서비스마다
    # 다른 mem_limit/JAVA_TOOL_OPTIONS 를 주려면 SPRING_PROFILES_ACTIVE 도 함께 반복해야 한다.
    # JVM 은 -Xmx/MaxRAMPercentage 둘 다 미지정 시 컨테이너 안에서 보이는 호스트 전체 메모리(7.6GB)
    # 기준으로 각자 독립적으로 기본 힙 상한(25%)을 잡아 서비스 수가 늘어날수록 swap thrashing/OOM kill
    # 위험이 커진다 (#232). ENTRYPOINT 가 exec form(java -jar app.jar, 셸 없음)이라 $JAVA_OPTS 셸
    # 치환은 못 쓰지만, JAVA_TOOL_OPTIONS 는 JVM 런처가 셸 개입 없이 직접 읽는 표준 환경변수라
    # Dockerfile 을 건드릴 필요가 없다.
    #
    # #272: 기존엔 여기 -Xms/-Xmx 를 프로덕션 docker stats 실측값 기반 고정 MiB 값으로 서비스마다
    # 손으로 계산해 넣었다 (#232/#234) — 컨테이너 자체엔 메모리 상한이 없어 힙 바깥(메타스페이스/
    # 스레드 스택 등) 사용량은 못 막았고, 트래픽/박스가 바뀔 때마다 재측정/재계산이 필요했다.
    # 지금은 대신:
    #   - mem_limit: 오늘 docker stats 실측값에 30% 여유를 얹어 32MiB 단위로 반올림한 "컨테이너
    #     전체" cgroup 상한 (넘으면 OOM kill).
    #   - MaxRAMPercentage=70 / InitialRAMPercentage=35: JDK 10+ 는 컨테이너 인지라 mem_limit 의
    #     70%까지를 힙 상한으로 자동 계산한다 (나머지 30%는 힙 외 사용량 몫 — 오늘도 이 서비스
    #     RES 실측 534.5MiB 가 이미 옛 -Xmx512m 를 넘어 있었다). -Xms=-Xmx/2 였던 관행 그대로
    #     InitialRAMPercentage 를 Max 의 절반으로 둔다.
    # 서비스별 mem_limit 만 바꾸면 힙이 비율로 자동 재계산되므로, 박스/트래픽이 바뀌어도 12개
    # 서비스 값을 전부 손으로 재계산할 필요가 없다. (다른 비즈니스 서비스들도 동일 근거로 서비스별
    # mem_limit/percentage 를 반복한다.)
    environment:
      # 로컬 docker compose 전용 오버라이드(docker-local) - #256으로 docker 프로파일이 2번째
      # EC2(10.0.0.243)를 가리키게 되면서 로컬 mysql 컨테이너로는 연결이 안 됐다. docker-local
      # 은 config 레포의 <service>-docker-local.yml 로 datasource.url 만 mysql:3306 으로 덮어쓴다.
      SPRING_PROFILES_ACTIVE: docker,docker-local
      # DB_USERNAME/DB_PASSWORD - PAYMENT_SECURITY_ENCRYPTION_KEY와 같은 이유로 기본값을 안 준다(#164) -
      # config repo도 더 이상 기본값이 없으므로, 로컬 mysql 서비스(위 블록)의 MYSQL_USER/MYSQL_PASSWORD와
      # 같은 값을 infrastructure/.env 에 직접 채워야 한다 (.env.example 참고).
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
    mem_limit: 704m
    # gateway 를 거치지 않고 이 서비스만 직접 curl/swagger 로 찔러볼 때만 주석 해제.
    # ports:
    #   - "8080:8080"

  project-service:
    <<: [*service-defaults, *business-depends-on-kafka]
    build:
      <<: *build-defaults
      args:
        MODULE: project-service
    container_name: earlybird-project-service
    # service-defaults 의 environment 를 통째로 덮어쓰므로 SPRING_PROFILES_ACTIVE/JAVA_TOOL_OPTIONS
    # 를 그대로 반복한다 - mem_limit/JAVA_TOOL_OPTIONS 값 근거는 order-service 주석 참고 (#272).
    # 오늘 docker stats 실측 534.8MiB * 1.3 여유 → 704m 로 반올림.
    # OPENAI_API_KEY 는 ai-service 와 동일하게 전달 — 없으면 임베딩 생성이 조용히 실패하고
    # 키워드 매치로만 폴백된다(ProjectEmbeddingService).
    environment:
      # docker-local 근거는 order-service 주석 참고.
      SPRING_PROFILES_ACTIVE: docker,docker-local
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=70
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    mem_limit: 704m
    # gateway 를 거치지 않고 이 서비스만 직접 curl/swagger 로 찔러볼 때만 주석 해제.
    # ports:
    #   - "8081:8081"

  payment-service:
    <<: [*service-defaults, *business-depends-on-kafka]
    build:
      <<: *build-defaults
      args:
        MODULE: payment-service
    container_name: earlybird-payment-service
    # service-defaults 의 environment 는 map 이라 <<: 병합이 아니라 완전히 덮어써진다 — 그래서 여기선
    # SPRING_PROFILES_ACTIVE 를 그대로 반복하고 PAYMENT_* 만 추가한다.
    # PAYMENT_SECURITY_ENCRYPTION_KEY 는 @NotBlank 필수값이라 비어있으면 기동 자체가 실패한다 (#183).
    # PAYMENT_GATEWAY 는 반드시 fake 로 기본값을 줘야 한다 — @ConditionalOnProperty(matchIfMissing=true)는
    # 프로퍼티가 "존재하되 빈 문자열"인 경우엔 적용되지 않아서, .env 에 값이 없을 때 그냥 ${VAR:-} 로
    # 두면 빈 문자열이 주입되어 FakePaymentGateway/TossPaymentGateway 둘 다 안 만들어지고 기동이 깨진다.
    environment:
      # docker-local 근거는 order-service 주석 참고.
      SPRING_PROFILES_ACTIVE: docker,docker-local
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # service-defaults 의 environment 를 통째로 덮어쓰므로 JAVA_TOOL_OPTIONS 도 그대로 반복한다 -
