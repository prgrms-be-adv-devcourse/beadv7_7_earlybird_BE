spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # 설정의 단일 출처 — GitHub 원격 저장소.
          # 저장소가 private 이라 인증이 필요하다: 환경변수 GIT_USERNAME(깃허브 계정)과
          # GIT_PERSONAL_ACCESS_TOKEN를 실행 환경(IntelliJ Run Configuration 등)에 설정할 것.
          # 로컬 파일로 되돌리려면 file://${user.home}/config-repo 로 바꾸면 된다.
          uri: https://github.com/prgrms-be-adv-devcourse/beadv7_7_earlybird_config.git
          default-label: main
          username: ${GIT_USERNAME}
          password: ${GIT_PERSONAL_ACCESS_TOKEN}

server:
  port: 8888
