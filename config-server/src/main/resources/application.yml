spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # 설정의 단일 출처 — GitHub 원격 저장소.
          # 저장소가 private 이라 인증이 필요하다: 환경변수 GIT_USERNAME(깃허브 계정)과
          # GIT_PERSONAL_ACCESS_TOKEN를 실행 환경(IntelliJ Run Configuration 등)에 설정할 것.
          # 로컬 파일로 되돌리려면 file://${user.home}/config-repo 로 바꾸면 된다.
          # (docker-compose 로컬 테스트는 이 파일을 건드리지 않고 SPRING_PROFILES_ACTIVE=native 로
          # application-native.yml 을 얹어서 로컬 파일시스템을 쓴다 — 팀 전체가 쓰는 이 기본값은 그대로.)
          uri: https://github.com/prgrms-be-adv-devcourse/beadv7_7_earlybird_config.git
          default-label: main
          username: ${GIT_USERNAME}
          password: ${GIT_PERSONAL_ACCESS_TOKEN}

server:
  port: 8888

# config-server 자신은 config-server를 import하지 않으므로 (자기 자신에게 요청할 수 없다),
# 공유 config repo의 logging.* 설정이 적용되지 않는다 — 여기 로컬에 별도로 정의해야 한다.
logging:
  file:
    name: ./logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/${spring.application.name}.%d{yyyy-MM-dd}.%i.log
      max-history: 30
      total-size-cap: 1GB
