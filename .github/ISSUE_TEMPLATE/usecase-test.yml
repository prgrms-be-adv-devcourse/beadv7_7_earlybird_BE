name: 유스케이스 테스트 (Use Case Test)
description: 테스트할 서비스별 use case 등록
title: "[usecase-test] "
labels: ["🧪 테스트 케이스"]
body:
  - type: dropdown
    id: service
    attributes:
      label: 대상 서비스
      options:
        - order-service
        - project-service
        - payment-service
        - user-service
        - cart-service
        - settlement-service
        - file-service
        - board-service
        - notification-service
        - chat-service
        - gateway-server
        - discovery-server
        - config-server
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: case 설명
      placeholder: |
        창작자가 프로젝트를 등록하고 승인 없이 바로 펀딩을 시작할 수 있는지 확인
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: 테스트 초기설정 방법
      description: 필요한 data, 유저 권한 등
      placeholder: |
        - CREATOR role을 가진 테스트 계정 1개 필요 (없으면 POST /api/v1/users/me/creator로 먼저 전환)
        - project-service DB에 카테고리 시드 데이터 존재해야 함
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 테스트 순서
      description: 번호를 매겨 순서대로 작성 (호출할 API 포함)
      placeholder: |
        1. POST /api/v1/users/signup 로 회원가입
        2. POST /api/v1/users/me/creator 로 창작자 등록
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      placeholder: |
        - 응답 200, project 상태가 FUNDING으로 바뀜
        - GET /api/v1/projects/{id} 재조회 시 status: "FUNDING" 확인됨
    validations:
      required: true
  - type: checkboxes
    id: result
    attributes:
      label: 테스트 결과
      options:
        - label: 로컬에서 통과
        - label: 운영(prod)에서 통과
