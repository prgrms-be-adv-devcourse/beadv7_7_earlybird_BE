name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
jobs:
  build:
    name: deploy
    runs-on: ubuntu-latest
    # workflow_run fires for every CI run regardless of branch/outcome, so gate here:
    # only deploy a main-branch CI run that actually passed. workflow_dispatch bypasses
    # this entirely since it has no associated workflow_run event.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # fetch-depth 1 (the default) only fetches the checked-out commit itself, with no
          # parent - paths-filter's default push-event comparison (HEAD^ vs HEAD) needs the
          # parent commit to exist locally.
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # No `base` given -> paths-filter defaults to comparing against HEAD^. On this repo
          # each CD run corresponds to one push to main (normally one PR merge commit), so
          # HEAD^ vs HEAD is exactly the diff that CI just validated.
          filters: |
            shared:
              - 'common/**'
              - 'Dockerfile'
              - 'build.gradle'
              - 'settings.gradle'
              - 'infrastructure/**'
            config-server: 'config-server/**'
            discovery-server: 'discovery-server/**'
            gateway-server: 'gateway-server/**'
            order-service: 'order-service/**'
            project-service: 'project-service/**'
            payment-service: 'payment-service/**'
            user-service: 'user-service/**'
            cart-service: 'cart-service/**'
            settlement-service: 'settlement-service/**'
            file-service: 'file-service/**'
            board-service: 'board-service/**'
            notification-service: 'notification-service/**'

      - name: Compute deploy targets
        id: targets
        # `shared` covers deps every service builds against (common/, root Dockerfile,
        # root build.gradle/settings.gradle) or shared deploy topology (infrastructure/,
        # e.g. docker-compose.yml, Caddyfile) - any of those changing means every service
        # needs a rebuild, not just the ones with their own directory touched.
        run: |
          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo 'services=config-server discovery-server gateway-server caddy order-service project-service payment-service user-service cart-service settlement-service file-service board-service notification-service' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ join(fromJSON(steps.filter.outputs.changes), ' ') }}' >> "$GITHUB_OUTPUT"
          fi

      - uses: appleboy/ssh-action@v1
        # Nothing changed that any service depends on (e.g. a docs-only push) -> skip the SSH
        # connection and remote git pull entirely instead of running a no-op loop.
        if: steps.targets.outputs.services != ''
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # drone-ssh kills the remote command after this long regardless of progress.
          # Default is 10m, which isn't enough headroom for a full rebuild.
          command_timeout: '30m'
          envs: SERVICES
          script: |
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            git pull
            # Build one service at a time instead of a single `docker compose up -d --build`
            # (which builds all images in parallel via buildx bake). EC2 is a 2-vCPU box,
            # so many concurrent Gradle builds thrash the CPU badly enough to make even sshd
            # unresponsive - that's what caused a past CD run to time out and the box to need
            # a reboot. Sequential builds are slower in total, but each one actually finishes.
            # $SERVICES is the subset `targets` determined actually needs rebuilding - see that
            # step for how it's picked.
            # -f infrastructure/docker-compose.prod.yml layers the AWS-only overrides (currently
            # just gateway-server's host port) on top of the shared base file - see that file
            # for why. Local dev never passes it, so nothing there is affected.
            for svc in $SERVICES; do
              docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --build "$svc"
            done
        env:
          SERVICES: ${{ steps.targets.outputs.services }}
