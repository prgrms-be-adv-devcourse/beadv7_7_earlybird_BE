name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
jobs:
  build:
    name: deploy
    runs-on: ubuntu-latest
    # workflow_run은 브랜치/결과와 무관하게 모든 CI 실행마다 발생하므로 여기서 게이팅한다:
    # main 브랜치에서 실제로 성공한 CI 실행만 배포한다. workflow_dispatch는 연결된
    # workflow_run 이벤트가 없으므로 이 조건을 완전히 우회한다.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # drone-ssh는 진행 상황과 무관하게 이 시간이 지나면 원격 명령을 강제 종료한다.
          # 기본값 10분으로는 12개 이미지를 전부 재빌드하기엔 여유가 부족하다.
          command_timeout: '30m'
          script: |
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            git pull
            # 단일 `docker compose up -d --build`(buildx bake로 12개 이미지를 전부 병렬
            # 빌드)가 아니라 서비스를 한 번에 하나씩 빌드한다. EC2는 2 vCPU 짜리라
            # Gradle 빌드 12개가 동시에 돌면 CPU 경합이 심해져 sshd조차 응답하지
            # 않게 되는데, 이 때문에 CD 실행이 타임아웃되고 인스턴스를 재부팅해야
            # 했던 적이 있다. 순차 빌드는 전체 시간은 더 걸리지만 각 빌드가 확실히 끝난다.
            # -f infrastructure/docker-compose.prod.yml 은 공용 base 파일 위에 AWS 전용
            # 오버라이드(현재는 gateway-server 호스트 포트뿐)를 얹는다 - 이유는 그 파일
            # 참고. 로컬 개발에서는 이 옵션을 절대 넘기지 않으므로 영향 없음.
            for svc in config-server discovery-server gateway-server caddy order-service project-service payment-service user-service cart-service settlement-service file-service board-service notification-service; do
              docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --build "$svc"
            done