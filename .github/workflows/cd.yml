name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
# Serialize deploys instead of letting them overlap: concurrent `docker compose build`s on the
# same 2-vCPU EC2 box would reintroduce the CPU contention this sequential-build design exists
# to avoid, and concurrent runs would also race pushing the cd-deployed tag against each other.
concurrency:
  group: cd-deploy
  cancel-in-progress: false
jobs:
  build:
    name: deploy
    runs-on: ubuntu-latest
    # workflow_run fires for every CI run regardless of branch/outcome, so gate here:
    # only deploy a main-branch CI run that actually passed. workflow_dispatch bypasses
    # this entirely since it has no associated workflow_run event.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history, not just a fixed few commits back: the `cd-deployed` tag below can
          # point arbitrarily far behind HEAD if recent runs failed or were skipped, and we
          # need that commit locally to diff against it.
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        # `cd-deployed` is moved to HEAD by the last step of this job, but only on a fully
        # successful run - so it always marks the last commit CD actually finished deploying.
        # Diffing against it (instead of a fixed HEAD~1) means a run that fails or is skipped
        # never loses track of what's still undeployed: the tag simply doesn't move, and the
        # next run's diff naturally covers everything since the last real success, no matter
        # how many runs failed or were skipped in between.
        run: |
          deployed_sha=$(git ls-remote origin refs/tags/cd-deployed | cut -f1)
          if [ -z "$deployed_sha" ]; then
            echo "No cd-deployed tag yet - treating this as a first run and redeploying everything."
          fi
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.base.outputs.sha != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          base: ${{ steps.base.outputs.sha }}
          filters: |
            shared:
              - 'common/**'
              - 'Dockerfile'
              - 'build.gradle'
              - 'settings.gradle'
              - 'infrastructure/**'
            config-server: 'config-server/**'
            discovery-server: 'discovery-server/**'
            gateway-server: 'gateway-server/**'
            order-service: 'order-service/**'
            project-service: 'project-service/**'
            payment-service: 'payment-service/**'
            user-service: 'user-service/**'
            cart-service: 'cart-service/**'
            settlement-service: 'settlement-service/**'
            file-service: 'file-service/**'
            board-service: 'board-service/**'
            notification-service: 'notification-service/**'

      - name: Compute deploy targets
        id: targets
        # No cd-deployed tag yet (first run) or `shared` changed (common/, root Dockerfile,
        # root build.gradle/settings.gradle, or infrastructure/ - deps every service builds
        # against or shared deploy topology) -> rebuild everything. Otherwise just the
        # services paths-filter matched.
        run: |
          if [ -z "${{ steps.base.outputs.sha }}" ] || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo 'services=config-server discovery-server gateway-server caddy order-service project-service payment-service user-service cart-service settlement-service file-service board-service notification-service' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ join(fromJSON(steps.filter.outputs.changes), ' ') }}' >> "$GITHUB_OUTPUT"
          fi

      - uses: appleboy/ssh-action@v1
        # Nothing changed that any service depends on (e.g. a docs-only push) -> skip the SSH
        # connection and remote git pull entirely instead of running a no-op loop.
        if: steps.targets.outputs.services != ''
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # drone-ssh kills the remote command after this long regardless of progress.
          # Default is 10m, which isn't enough headroom for a full rebuild.
          command_timeout: '30m'
          envs: SERVICES
          script: |
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            git pull
            # Build one service at a time instead of a single `docker compose up -d --build`
            # (which builds all images in parallel via buildx bake). EC2 is a 2-vCPU box,
            # so many concurrent Gradle builds thrash the CPU badly enough to make even sshd
            # unresponsive - that's what caused a past CD run to time out and the box to need
            # a reboot. Sequential builds are slower in total, but each one actually finishes.
            # $SERVICES is the subset `targets` determined actually needs rebuilding - see that
            # step for how it's picked.
            # -f infrastructure/docker-compose.prod.yml layers the AWS-only overrides (currently
            # just gateway-server's host port) on top of the shared base file - see that file
            # for why. Local dev never passes it, so nothing there is affected.
            for svc in $SERVICES; do
              docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --build "$svc"
            done
        env:
          SERVICES: ${{ steps.targets.outputs.services }}

      - name: Mark commit as deployed
        # Runs whenever every prior step succeeded (steps skipped by their own `if` - e.g. no
        # changes to deploy - don't count as failures), so this only advances the marker past
        # a commit whose relevant changes (if any) actually made it to EC2.
        run: |
          git tag -f cd-deployed
          git push origin refs/tags/cd-deployed -f
