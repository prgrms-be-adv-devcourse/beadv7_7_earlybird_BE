name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

env:
  # 하드코딩 - github.repository 는 실제 대소문자(...beadv7_7_earlybird_BE)를 그대로 담지만
  # Docker/GHCR 이미지 이름은 소문자여야 한다 (FE deploy.yml 과 동일한 이유).
  IMAGE_PREFIX: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be
  # workflow_run 컨텍스트의 github.sha 는 이 CD 워크플로 자체가 default 브랜치에서 체크아웃한
  # 커밋이지, CI 를 트리거한 커밋이 아니다 (흔한 함정). workflow_dispatch 에는 애초에
  # event.workflow_run 이 없으므로 그때는 github.sha 로 폴백한다.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    # workflow_run은 브랜치/결과와 무관하게 모든 CI 실행마다 발생하므로 여기서 게이팅한다:
    # main 브랜치에서 실제로 성공한 CI 실행만 배포한다. workflow_dispatch는 연결된
    # workflow_run 이벤트가 없으므로 이 조건을 완전히 우회한다.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - config-server
          - discovery-server
          - gateway-server
          - order-service
          - project-service
          - payment-service
          - user-service
          - cart-service
          - settlement-service
          - file-service
          - board-service
          - notification-service
          - ai-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # cache-from/cache-to: type=gha 를 쓰려면 기본 docker 드라이버가 아니라
      # docker-container 드라이버가 필요하다.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 서비스 12개가 각자 다른 러너에서 병렬로 빌드되므로, EC2(2 vCPU) 한 대에서 buildx
      # bake로 전부 동시에 빌드했다가 CPU 경합으로 sshd까지 응답 없어졌던 문제(CD #148)
      # 자체가 사라진다. 모든 서비스가 동일한 루트 Dockerfile을 MODULE 인자만 바꿔 쓴다
      # (infrastructure/docker-compose.yml의 x-build-defaults와 동일한 패턴).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: MODULE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-k8s:
    name: deploy (k3s core three)
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAYMENT_SECURITY_ENCRYPTION_KEY: ${{ secrets.PAYMENT_SECURITY_ENCRYPTION_KEY }}
          PAYMENT_TOSS_SECRET_KEY: ${{ secrets.PAYMENT_TOSS_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          # 데이터 박스(k3s 컨트롤 플레인) - #198 핵심 3종(config/discovery/gateway-server)의
          # 파드는 nodeSelector로 앱 박스에 고정돼 있지만, kubectl 은 항상 컨트롤 플레인에
          # 대고 실행해야 하므로 SSH 타겟은 데이터 박스다. 나머지는 앱 박스와 동일한 키/계정.
          host: ${{ secrets.DATA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: '10m'
          envs: JWT_SECRET,GMAIL_USERNAME,GMAIL_APP_PASSWORD,PAYMENT_SECURITY_ENCRYPTION_KEY,PAYMENT_TOSS_SECRET_KEY,OPENAI_API_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,DEPLOY_SHA
          script: |
            set -e
            # ec2-user는 /etc/rancher/k3s/k3s.yaml을 직접 읽을 수 있어(644, k3s 기본 권한)
            # sudo 없이도 kubectl이 되지만, appleboy/ssh-action은 비대화형 셸이라
            # .bash_profile의 KUBECONFIG 관례를 안 읽는다 - 여기서 명시한다.
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            git fetch origin && git reset --hard origin/main
            # user-service(발급)/gateway-server(검증) 둘 다 이제 이 Secret 하나를 같이 읽는다
            # (#198 batch 2로 user-service도 k8s로 옮겨오면서 앱 박스 .env와의 수동 동기화가
            # 아예 필요 없어졌다) - 매 배포마다 재적용해 방치로 값이 어긋나는 사고를 막는다.
            kubectl -n webapp create secret generic gateway-jwt \
              --from-literal=JWT_SECRET="$JWT_SECRET" --dry-run=client -o yaml | kubectl apply -f -
            # board-service의 리뷰 알림 메일(Gmail SMTP) - 비어있어도 기동은 막지 않지만 실제
            # 메일 발송은 실패한다.
            kubectl -n webapp create secret generic board-gmail \
              --from-literal=GMAIL_USERNAME="$GMAIL_USERNAME" \
              --from-literal=GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
            # payment-service의 AES-256 암호화 키 - 비어있으면 기동 자체가 실패한다 (#183).
            # 앱 박스 .env에 있던 기존 값과 반드시 같아야 한다 (값이 바뀌면 기존 결제 데이터
            # 복호화 불가). PAYMENT_TOSS_SECRET_KEY는 아직 fake 게이트웨이만 쓰므로 비어있어도 됨.
            kubectl -n webapp create secret generic payment-secrets \
              --from-literal=PAYMENT_SECURITY_ENCRYPTION_KEY="$PAYMENT_SECURITY_ENCRYPTION_KEY" \
              --from-literal=PAYMENT_TOSS_SECRET_KEY="$PAYMENT_TOSS_SECRET_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n webapp create secret generic ai-openai \
              --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" --dry-run=client -o yaml | kubectl apply -f -
            # file-service presigned upload (#354) - 버킷/리전/CDN 도메인은 config-server의
            # file-service.yml 기본값(earlybird-files/ap-northeast-2)이 그대로 맞으므로 여기서
            # 오버라이드하지 않는다. 자격증명만 SDK 기본 체인이 읽는 환경변수로 주입.
            kubectl -n webapp create secret generic file-service-s3 \
              --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f infrastructure/k8s/
            for svc in config-server discovery-server gateway-server file-service user-service board-service notification-service order-service project-service payment-service cart-service settlement-service ai-service; do
              kubectl -n webapp set image "deployment/$svc" \
                "$svc=ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be-$svc:$DEPLOY_SHA"
            done
            # :latest 로 rollout restart 하는 대신 :SHA 태그로 set image - 이래야 kubectl rollout
            # undo/history가 실제로 의미 있는 리비전을 가리킨다 (docker :rollback 태그의 k8s 버전).
            for svc in config-server discovery-server gateway-server file-service user-service board-service notification-service order-service project-service payment-service cart-service settlement-service ai-service; do
              kubectl -n webapp rollout status "deployment/$svc" --timeout=5m
            done

  deploy:
    name: deploy
    needs: deploy-k8s
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 이미지 빌드가 GitHub Actions 러너로 옮겨가면서 이 단계는 pull + up -d만
          # 하면 되고, 원래 30분을 잡아먹던 이유(EC2에서 12개 이미지 순차 빌드)가
          # 사라졌다. 그래도 네트워크 지연/헬스체크 대기를 감안해 여유를 좀 남겨둔다.
          command_timeout: '10m'
          envs: GHCR_PAT
          script: |
            set -e
            # without this, a failure partway through (e.g. the up -d conflict below) doesn't stop
            # the script - it just falls through to the next line, and the step's reported result
            # ends up being whatever the LAST command returned. That's how a broken deploy showed
            # as "success": `up -d` failed on most services, but the final `docker restart
            # earlybird-caddy` succeeded, so the run was green while the backend was down.
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            git fetch origin && git reset --hard origin/main
            # 이제 fe뿐 아니라 12개 BE 서비스 이미지도 전부 private GHCR 패키지 (조직 정책상
            # public 전환 불가) - pull 전 로그인 필요. config-server가 이미 같은 방식(PAT)으로
            # private config repo에 접근하는 것과 동일한 패턴.
            echo "$GHCR_PAT" | docker login ghcr.io -u krkhnh --password-stdin
            # #198 완료 (2026-08-14): 12개 BE 서비스 전부 k8s로 이전되어 이 박스에서 compose로
            # 뜨는 business-service가 하나도 없다 - 예전엔 여기서 :latest를 :rollback으로
            # 재태깅해 pull 직전 버전을 보존했지만(이미지 pull로 dangling <none>:<none>이
            # ~10GB 디스크를 조용히 먹은 적 있었음), 이제 이 박스가 pull하는 이미지는 kafka/
            # caddy/fe뿐이라 더 이상 필요 없다. business-service 롤백은 k8s
            # `kubectl rollout undo`(deploy-k8s 잡의 :SHA 태그 기반)로 대체됨.
            # -f infrastructure/docker-compose.prod.yml 은 공용 base 파일 위에 AWS 전용
            # 오버라이드(서비스별 image: 태그, gateway-server 호스트 포트 등)를 얹는다 - 이유는
            # 그 파일 참고. 로컬 개발에서는 이 옵션을 절대 넘기지 않으므로 영향 없음.
            # EC2에서의 로컬 이미지 빌드는 더 이상 하지 않는다 - build job이 GHCR에 미리
            # push해둔 이미지를 pull만 한다.
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml pull
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d
            # caddy bind-mounts Caddyfile by host path (./Caddyfile:/etc/caddy/Caddyfile:ro) -
            # that path string never changes even when git pull replaces the file's contents, so
            # plain `up -d` never sees a reason to recreate the container and caddy keeps serving
            # whatever config it last loaded. Force a fresh read every deploy so routing changes
            # always take effect (bit us in production: FE cutover shipped but Caddyfile's new
            # /api split sat unloaded until a manual restart).
            #
            # `docker compose up -d --force-recreate caddy` was tried here first but silently
            # no-ops under appleboy/ssh-action specifically (works fine run manually over plain
            # SSH) - see issue #212. `docker restart` re-execs the process and re-reads the
            # bind-mounted Caddyfile, which is all we actually need; it just won't pick up a
            # change to caddy's own image/ports/volumes in docker-compose.yml (rare enough to
            # handle manually if it ever happens).
            docker restart earlybird-caddy
            # Safe to prune unconditionally: any image a running container still uses is never
            # touched by `image prune` - this only clears dangling/superseded layers from
            # kafka/caddy/fe pulls (business-service images no longer land on this box at all).
            docker image prune -f
