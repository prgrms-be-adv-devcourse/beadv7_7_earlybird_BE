name: CD Deploy
on:
  workflow_run:
    workflows: [CD Build]
    types: [completed]
  workflow_dispatch:

env:
  # workflow_dispatch를 GitHub UI에서 실행할 때 "Use workflow from"에 브랜치 대신 태그
  # (예: v0.0.1)를 고르면 그 커밋이 github.sha가 된다 - cd-build.yml이 이미 그 커밋 SHA로
  # 이미지를 태그해뒀다는 전제로 그대로 재사용한다. CD Build 완료로 자동 실행될 때는 그
  # 빌드가 만든 커밋 SHA를 쓴다.
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-k8s:
    name: deploy (k3s core three)
    runs-on: ubuntu-latest
    # workflow_run은 결과와 무관하게 모든 CD Build 실행마다 발생하므로 여기서 게이팅한다:
    # 성공한 빌드만 배포한다. main 브랜치 여부는 CD Build 자신의 if(CI의 head_branch 기준,
    # 신뢰 가능)에서 이미 걸렀으므로 여기서 다시 확인하지 않는다 - main과 develop이 같은
    # 커밋을 가리키는 시점에는(#387, force-push로 main을 develop에 맞춤) 이 워크플로 자신의
    # workflow_run.head_branch가 "main" 대신 "develop"으로 보고돼(체이닝된 workflow_run
    # 특유의 흔한 함정) 여기서 다시 검사하면 배포가 조용히 skip된다. workflow_dispatch는
    # 연결된 workflow_run 이벤트가 없으므로 이 조건을 완전히 우회한다.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAYMENT_SECURITY_ENCRYPTION_KEY: ${{ secrets.PAYMENT_SECURITY_ENCRYPTION_KEY }}
          PAYMENT_TOSS_SECRET_KEY: ${{ secrets.PAYMENT_TOSS_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          # 데이터 박스(k3s 컨트롤 플레인) - #198 핵심 3종(config/discovery/gateway-server)의
          # 파드는 nodeSelector로 앱 박스에 고정돼 있지만, kubectl 은 항상 컨트롤 플레인에
          # 대고 실행해야 하므로 SSH 타겟은 데이터 박스다. 나머지는 앱 박스와 동일한 키/계정.
          host: ${{ secrets.DATA_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # rollout status 타임아웃을 5m→10m로 올린 만큼(#370) 여유를 둔다 - 13개 서비스가
          # 거의 동시에 재시작해 순간적으로 노드 리소스 경합이 생겨도(memory request 상시 69%+),
          # probe 실패로 재시작 몇 번 거치고 나면 결국 뜬다는 게 관찰된 패턴이라 실패 처리 대신
          # 기다려주는 쪽으로 조정.
          command_timeout: '20m'
          envs: JWT_SECRET,GMAIL_USERNAME,GMAIL_APP_PASSWORD,PAYMENT_SECURITY_ENCRYPTION_KEY,PAYMENT_TOSS_SECRET_KEY,OPENAI_API_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,DB_USERNAME,DB_PASSWORD,IMAGE_TAG
          script: |
            set -e
            # ec2-user는 /etc/rancher/k3s/k3s.yaml을 직접 읽을 수 있어(644, k3s 기본 권한)
            # sudo 없이도 kubectl이 되지만, appleboy/ssh-action은 비대화형 셸이라
            # .bash_profile의 KUBECONFIG 관례를 안 읽는다 - 여기서 명시한다.
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            # reset 전 커밋을 남겨둔다 - 이 박스의 HEAD가 곧 "마지막으로 배포된 커밋"이므로,
            # 별도 상태 저장소 없이도 이걸 기준으로 이번에 실제 바뀐 서비스 모듈을 가려낼 수 있다
            # (아래 #385 변경 감지). force-push로 main 히스토리가 재작성돼도(#387) diff 자체는
            # 트리 내용 비교라 이 두 커밋 객체만 로컬에 남아있으면 문제없이 동작한다.
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin && git reset --hard origin/main
            # user-service(발급)/gateway-server(검증) 둘 다 이제 이 Secret 하나를 같이 읽는다
            # (#198 batch 2로 user-service도 k8s로 옮겨오면서 앱 박스 .env와의 수동 동기화가
            # 아예 필요 없어졌다) - 매 배포마다 재적용해 방치로 값이 어긋나는 사고를 막는다.
            kubectl -n webapp create secret generic gateway-jwt \
              --from-literal=JWT_SECRET="$JWT_SECRET" --dry-run=client -o yaml | kubectl apply -f -
            # board-service의 리뷰 알림 메일(Gmail SMTP) - 비어있어도 기동은 막지 않지만 실제
            # 메일 발송은 실패한다.
            kubectl -n webapp create secret generic board-gmail \
              --from-literal=GMAIL_USERNAME="$GMAIL_USERNAME" \
              --from-literal=GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
            # payment-service의 AES-256 암호화 키 - 비어있으면 기동 자체가 실패한다 (#183).
            # 앱 박스 .env에 있던 기존 값과 반드시 같아야 한다 (값이 바뀌면 기존 결제 데이터
            # 복호화 불가). PAYMENT_TOSS_SECRET_KEY는 아직 fake 게이트웨이만 쓰므로 비어있어도 됨.
            kubectl -n webapp create secret generic payment-secrets \
              --from-literal=PAYMENT_SECURITY_ENCRYPTION_KEY="$PAYMENT_SECURITY_ENCRYPTION_KEY" \
              --from-literal=PAYMENT_TOSS_SECRET_KEY="$PAYMENT_TOSS_SECRET_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n webapp create secret generic ai-openai \
              --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" --dry-run=client -o yaml | kubectl apply -f -
            # DB 계정/비밀번호 - 9개 서비스(order/project/payment/user/cart/settlement/file/board/
            # notification)가 전부 이 Secret 하나를 공유한다 (#164). 데이터 박스 mysql 컨테이너의
            # MYSQL_USER/MYSQL_PASSWORD(docker-compose.data.yml, 그 박스의 .env로만 관리)와 반드시
            # 같은 값이어야 한다 - 값이 어긋나면 전 서비스 DB 연결이 한꺼번에 끊긴다.
            kubectl -n webapp create secret generic db-credentials \
              --from-literal=DB_USERNAME="$DB_USERNAME" \
              --from-literal=DB_PASSWORD="$DB_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
            # file-service presigned upload (#354) - 버킷/리전/CDN 도메인은 config-server의
            # file-service.yml 기본값(earlybird-files/ap-northeast-2)이 그대로 맞으므로 여기서
            # 오버라이드하지 않는다. 자격증명만 SDK 기본 체인이 읽는 환경변수로 주입.
            kubectl -n webapp create secret generic file-service-s3 \
              --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
            # 서비스와 무관한 공통 리소스만 먼저 적용 - 서비스별 매니페스트는 (#385) 아래에서
            # 실제로 배포하는 서비스에 한해서만, 그 서비스 차례에 적용한다.
            kubectl apply -f infrastructure/k8s/namespace.yaml
            #
            # #385: 매 배포마다 13개 서비스를 전부 재시작하면 리소스가 넉넉하지 않은 두 EC2에
            # 불필요한 부하가 걸린다 - PREV_SHA..HEAD diff로 실제 경로가 바뀐 서비스만 골라
            # 그 서비스만 배포한다. common/(모든 서비스가 컴파일에 물고 들어가는 공유 모듈)이나
            # 루트 빌드 설정이 바뀌면 diff 경로만으로는 영향 범위를 알 수 없으므로 안전하게
            # 전체 재배포로 취급한다. 빌드(cd-build.yml)는 그대로 매번 13개 서비스 이미지를
            # 전부 새로 태그해 두므로, 배포만 걸러도 태그 불일치 없이 안전하다.
            ALL_SERVICES="config-server discovery-server gateway-server file-service user-service board-service notification-service order-service project-service payment-service cart-service settlement-service ai-service"
            CHANGED_PATHS=$(git diff --name-only "$PREV_SHA" HEAD)
            if [ -z "$CHANGED_PATHS" ]; then
              CHANGED_SERVICES=""
            elif echo "$CHANGED_PATHS" | grep -qE '^(common/|build\.gradle|settings\.gradle|gradlew|Dockerfile)'; then
              CHANGED_SERVICES="$ALL_SERVICES"
            else
              CHANGED_SERVICES=""
              for svc in $ALL_SERVICES; do
                # 서비스 소스 디렉터리뿐 아니라 그 서비스의 k8s 매니페스트 변경도 배포 대상으로
                # 잡는다 - 코드는 그대로인데 리소스/프로브 설정만 바뀐 경우도 있다.
                echo "$CHANGED_PATHS" | grep -qE "^($svc/|infrastructure/k8s/$svc\.yaml$)" && CHANGED_SERVICES="$CHANGED_SERVICES $svc"
              done
            fi
            if [ -z "$CHANGED_SERVICES" ]; then
              echo "변경된 서비스 모듈 없음 ($PREV_SHA..$(git rev-parse HEAD)) - k8s 배포 스킵"
            else
              echo "변경된 서비스만 배포:$CHANGED_SERVICES"
              # infrastructure/k8s/*.yaml은 image를 고정 :latest로 선언해 둔다 - 예전처럼
              # `kubectl apply -f infrastructure/k8s/`를 배포 대상과 무관하게 통째로 먼저
              # 돌리면, 3-way merge가 지난 배포의 set image(:태그)로 벌어진 live 상태와의
              # 드리프트를 "리버트"로 해석해 13개 전부를 :latest로 되돌리면서 한꺼번에
              # 재시작시켜버린다 - CHANGED_SERVICES로 걸러도 그 뒤에 오는 이 apply 한 줄이
              # 매번 전체를 다시 건드리는 바람에 무의미해졌었다 (#385 배포 중 실제로 재현:
              # 13개 서비스가 apply 직후 동시에 재시작). 그래서 set image를 따로 두지 않고,
              # 서비스 차례가 왔을 때 그 서비스 매니페스트만 :latest -> :태그로 치환해서
              # 적용한다 - apply와 최종 이미지가 항상 일치하니 드리프트 자체가 생기지 않는다.
              #
              # (#370) 서비스별 적용 직후 바로 그 서비스의 rollout이 끝나길 기다려, 한 번에
              # 최대 1개 서비스만 재시작 중이도록 강제한다 - 그렇지 않으면 Recreate 전략상
              # 대상 서비스 전부가 거의 동시에 콜드 스타트해, 리소스가 빠듯한 노드에서 CPU가
              # 포화되고 probe 반복 실패로 rollout이 progressDeadlineSeconds(10m)를 넘겨버린다
              # (재현: CD #478/#479/#482). 전체 소요 시간은 늘지만, 지금도 동시 재시작 실패 시
              # 재시도로 10분+ 걸리며 결과만 잘못 failure로 보고되던 것에 비하면 실질적인
              # 증가는 크지 않다.
              for svc in $CHANGED_SERVICES; do
                sed "s#${svc}:latest#${svc}:${IMAGE_TAG}#" "infrastructure/k8s/${svc}.yaml" | kubectl apply -f -
                kubectl -n webapp rollout status "deployment/$svc" --timeout=10m
              done
            fi

  deploy:
    name: deploy
    needs: deploy-k8s
    runs-on: ubuntu-latest
    # deploy-k8s와 동일한 이유로 head_branch는 재확인하지 않는다 (위 주석 참고).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 이미지 빌드가 GitHub Actions 러너로 옮겨가면서 이 단계는 pull + up -d만
          # 하면 되고, 원래 30분을 잡아먹던 이유(EC2에서 12개 이미지 순차 빌드)가
          # 사라졌다. 그래도 네트워크 지연/헬스체크 대기를 감안해 여유를 좀 남겨둔다.
          command_timeout: '10m'
          envs: GHCR_PAT
          script: |
            set -e
            # without this, a failure partway through (e.g. the up -d conflict below) doesn't stop
            # the script - it just falls through to the next line, and the step's reported result
            # ends up being whatever the LAST command returned. That's how a broken deploy showed
            # as "success": `up -d` failed on most services, but the final `docker restart
            # earlybird-caddy` succeeded, so the run was green while the backend was down.
            cd /home/ec2-user/earlybird/beadv7_7_earlybird_BE
            git fetch origin && git reset --hard origin/main
            # 이제 fe뿐 아니라 12개 BE 서비스 이미지도 전부 private GHCR 패키지 (조직 정책상
            # public 전환 불가) - pull 전 로그인 필요. config-server가 이미 같은 방식(PAT)으로
            # private config repo에 접근하는 것과 동일한 패턴.
            echo "$GHCR_PAT" | docker login ghcr.io -u krkhnh --password-stdin
            # #198 완료 (2026-08-14): 12개 BE 서비스 전부 k8s로 이전되어 이 박스에서 compose로
            # 뜨는 business-service가 하나도 없다 - 예전엔 여기서 :latest를 :rollback으로
            # 재태깅해 pull 직전 버전을 보존했지만(이미지 pull로 dangling <none>:<none>이
            # ~10GB 디스크를 조용히 먹은 적 있었음), 이제 이 박스가 pull하는 이미지는 kafka/
            # caddy/fe뿐이라 더 이상 필요 없다. business-service 롤백은 k8s
            # `kubectl rollout undo`(deploy-k8s 잡의 태그 기반)로 대체됨.
            # -f infrastructure/docker-compose.prod.yml 은 공용 base 파일 위에 AWS 전용
            # 오버라이드(서비스별 image: 태그, gateway-server 호스트 포트 등)를 얹는다 - 이유는
            # 그 파일 참고. 로컬 개발에서는 이 옵션을 절대 넘기지 않으므로 영향 없음.
            # EC2에서의 로컬 이미지 빌드는 더 이상 하지 않는다 - build job이 GHCR에 미리
            # push해둔 이미지를 pull만 한다.
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml pull
            docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d
            # caddy bind-mounts Caddyfile by host path (./Caddyfile:/etc/caddy/Caddyfile:ro) -
            # that path string never changes even when git pull replaces the file's contents, so
            # plain `up -d` never sees a reason to recreate the container and caddy keeps serving
            # whatever config it last loaded. Force a fresh read every deploy so routing changes
            # always take effect (bit us in production: FE cutover shipped but Caddyfile's new
            # /api split sat unloaded until a manual restart).
            #
            # `docker compose up -d --force-recreate caddy` was tried here first but silently
            # no-ops under appleboy/ssh-action specifically (works fine run manually over plain
            # SSH) - see issue #212. `docker restart` re-execs the process and re-reads the
            # bind-mounted Caddyfile, which is all we actually need; it just won't pick up a
            # change to caddy's own image/ports/volumes in docker-compose.yml (rare enough to
            # handle manually if it ever happens).
            docker restart earlybird-caddy
            # Safe to prune unconditionally: any image a running container still uses is never
            # touched by `image prune` - this only clears dangling/superseded layers from
            # kafka/caddy/fe pulls (business-service images no longer land on this box at all).
            docker image prune -f

  smoke-test:
    name: smoke test (live flow)
    needs: deploy
    runs-on: ubuntu-latest
    # needs: deploy 만으로 충분하다 - deploy 자신이 이미 deploy-k8s에 needs를 걸고 있고, needs
    # 체인의 기본 조건(success())상 deploy-k8s/deploy 둘 중 하나라도 skip/실패하면 이 잡도 자동
    # skip되므로 위 두 잡의 if 조건(#154/#155 참고 - 여기선 무관)을 다시 반복할 필요가 없다.
    #
    # #157: CI가 아니라 배포 후 스모크 테스트로 넣은 이유 - CI는 config/discovery/gateway/
    # user/project/order-service 전체 스택을 새로 띄워야 하는데, 그 오케스트레이션 비용이
    # #112(CD가 서비스당 순차 컴파일로 ~20분 걸리던 문제)와 같은 성격의 부담을 CI 쪽에도
    # 그대로 옮기는 셈이다. 반면 배포 직후엔 스택이 이미 떠 있으므로(k8s 3종 + 나머지),
    # 새로 띄우는 비용 없이 실제 운영 baseUrl을 상대로 바로 검증할 수 있다.
    #
    # 실패 시 처리: 자동 롤백은 하지 않는다 - 지금 이 리포에 롤백 자동화가 없고(수동
    # `kubectl rollout undo`만 존재, deploy job 주석 참고), 이 잡 하나를 위해 새로 만들 정도로
    # #157 범위가 넓지 않다. 대신 잡을 실패시켜 Actions 탭에 빨간불로 남긴다 - 사람이 보고
    # 필요하면 수동으로 rollout undo하는 흐름.
    #
    # #410이 머지되기 전까지는 이 잡이 placeOrder 스텝에서 계속 빨간불이다 - cart-service가
    # 게이트웨이 경유로 도달 불가능해(CartController 경로가 gateway cart-route와 어긋남)
    # addToCart가 항상 실패하고, 그 뒤 주문 생성도 "Order Cart is empty"로 막힌다. #154/#155와
    # 같은 성격의 활성화 전제 조건 - #410 머지 후 이 잡이 실제로 통과하는지 재확인할 것.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # deploy job의 rollout status(k8s 3종)와 docker compose up -d(caddy 재시작 포함)가 이미
      # 끝난 뒤라 대부분 바로 준비돼 있지만, DNS/엣지 전파 지연을 감안해 짧게 재시도한다.
      # Caddyfile은 /api/* 만 gateway로 proxy하므로(그 외 경로는 fe로 감) 실제 API 경로로
      # 확인한다 - 인증이 없어 401이 나도 게이트웨이까지는 도달했다는 뜻이라 준비된 것으로 본다.
      # 000(연결 자체 실패)과 502/503/504(업스트림 다운)만 "아직 준비 안 됨"으로 취급.
      - name: 게이트웨이 준비 대기
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://earlybird-team5.duckdns.org/api/v1/projects || echo 000)
            case "$code" in
              000|502|503|504)
                echo "게이트웨이 아직 준비 안 됨 (HTTP $code, $i/12) - 5초 후 재시도"
                sleep 5
                ;;
              *)
                exit 0
                ;;
            esac
          done
          echo "게이트웨이가 준비되지 않아 스모크 테스트를 진행할 수 없음"
          exit 1

      - name: 후원자/창작자 플로우 라이브 테스트
        run: ./gradlew :system-test:liveTest -Dsystem-test.baseUrl=https://earlybird-team5.duckdns.org
