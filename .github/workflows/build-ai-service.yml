name: Build ai-service

on:
  workflow_dispatch:

env:
  # cd.yml과 동일한 이유로 소문자 고정 (github.repository의 실제 대소문자와 다름).
  IMAGE_PREFIX: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_earlybird_be

jobs:
  build:
    name: build (ai-service)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cd.yml의 build job과 동일한 패턴(같은 루트 Dockerfile, MODULE 인자만 다름).
      # ai-service는 아직 cd.yml의 build/deploy 매트릭스에 포함되지 않았으므로
      # (DB 미정, config-repo 설정 미비) 별도 workflow_dispatch 전용으로 분리.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: MODULE=ai-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ai-service:latest
            ${{ env.IMAGE_PREFIX }}-ai-service:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
