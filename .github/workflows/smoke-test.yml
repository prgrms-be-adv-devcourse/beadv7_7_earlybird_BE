name: Smoke Test

# cd-deploy.yml의 smoke-test 잡에서 분리했다 (#453) - CD Build가 CI 완료를 트리거로
# 잡듯, CD Deploy 완료를 트리거로 도는 독립 워크플로로 둔다. cd-deploy.yml이 이 워크플로를
# uses:로 호출하는 방식(reusable workflow)도 써봤지만, 그 호출의 with:는 env 컨텍스트를
# 지원하지 않아 IMAGE_TAG를 그대로 넘길 수 없었다 - CD Build/CD Deploy와 동일하게
# workflow_run 체이닝으로 두면 그 문제 자체가 없고, 잡 구조도 나머지 두 워크플로와
# 일관된다.
on:
  workflow_run:
    workflows: [CD Deploy]
    types: [completed]
  # 배포 체인 없이 지금 떠 있는 운영 스택만 단독으로 재검증하고 싶을 때 수동 실행.
  # workflow_dispatch를 GitHub UI에서 실행할 때 "Use workflow from"으로 브랜치/태그를
  # 고르면 그 커밋이 github.sha가 된다 (cd-deploy.yml과 동일한 패턴).
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  smoke-test:
    name: smoke test (live flow)
    runs-on: ubuntu-latest
    # CD Build가 CI의 workflow_run에 거는 것과 동일한 게이팅 - CD Deploy가 실제로 성공한
    # 경우에만 돈다. branch 확인은 CD Build 단계에서 이미 걸렀으므로(그 파일 주석 참고)
    # 여기서 다시 하지 않는다.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # #157: CI가 아니라 배포 후 스모크 테스트로 넣은 이유 - CI는 config/discovery/gateway/
    # user/project/order-service 전체 스택을 새로 띄워야 하는데, 그 오케스트레이션 비용이
    # #112(CD가 서비스당 순차 컴파일로 ~20분 걸리던 문제)와 같은 성격의 부담을 CI 쪽에도
    # 그대로 옮기는 셈이다. 반면 배포 직후엔 스택이 이미 떠 있으므로(k8s 3종 + 나머지),
    # 새로 띄우는 비용 없이 실제 운영 baseUrl을 상대로 바로 검증할 수 있다.
    #
    # 실패 시 처리: 자동 롤백은 하지 않는다 - 지금 이 리포에 롤백 자동화가 없고(수동
    # `kubectl rollout undo`만 존재, cd-deploy.yml의 deploy 잡 주석 참고), 이 잡 하나를 위해
    # 새로 만들 정도로 #157 범위가 넓지 않다. 대신 잡을 실패시켜 Actions 탭에 빨간불로
    # 남긴다 - 사람이 보고 필요하면 수동으로 rollout undo하는 흐름.
    #
    # #410이 머지되기 전까지는 이 잡이 placeOrder 스텝에서 계속 빨간불이다 - cart-service가
    # 게이트웨이 경유로 도달 불가능해(CartController 경로가 gateway cart-route와 어긋남)
    # addToCart가 항상 실패하고, 그 뒤 주문 생성도 "Order Cart is empty"로 막힌다. #154/#155와
    # 같은 성격의 활성화 전제 조건 - #410 머지 후 이 잡이 실제로 통과하는지 재확인할 것.
    steps:
      - name: 배포 후 10분 대기
        run: sleep 600

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 호출하는 쪽(cd-deploy.yml)의 rollout status(k8s 3종)와 docker compose up -d(caddy
      # 재시작 포함)가 이미 끝난 뒤라 대부분 바로 준비돼 있지만, DNS/엣지 전파 지연을 감안해
      # 짧게 재시도한다. Caddyfile은 /api/* 만 gateway로 proxy하므로(그 외 경로는 fe로 감)
      # 실제 API 경로로 확인한다 - 인증이 없어 401이 나도 게이트웨이까지는 도달했다는 뜻이라
      # 준비된 것으로 본다. 000(연결 자체 실패)과 502/503/504(업스트림 다운)만 "아직 준비 안
      # 됨"으로 취급.
      #
      # #453: 단발성 200 하나로 곧장 통과시키면 rollout/caddy 재시작 직후의 짧은 불안정
      # 구간(캐디가 막 재시작되어 아직 정착하지 않았거나, 방금 뜬 파드가 반짝 응답 후 다시
      # 불안정해지는 창)을 걸러내지 못해 false negative가 났다 - 연속 3회 성공을 요구해
      # 그 구간을 흡수한다.
      - name: 게이트웨이 준비 대기
        run: |
          required_successes=3
          consecutive_successes=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://earlybird-team5.duckdns.org/api/v1/projects || echo 000)
            case "$code" in
              000|502|503|504)
                echo "게이트웨이 아직 준비 안 됨 (HTTP $code, $i/20) - 연속 성공 카운트 초기화, 5초 후 재시도"
                consecutive_successes=0
                sleep 5
                ;;
              *)
                consecutive_successes=$((consecutive_successes + 1))
                echo "게이트웨이 응답 성공 (HTTP $code, 연속 $consecutive_successes/$required_successes, $i/20)"
                if [ "$consecutive_successes" -ge "$required_successes" ]; then
                  exit 0
                fi
                sleep 2
                ;;
            esac
          done
          echo "게이트웨이가 안정적으로 준비되지 않아 스모크 테스트를 진행할 수 없음"
          exit 1

      - name: 후원자/창작자 플로우 라이브 테스트
        run: ./gradlew :system-test:liveTest -Dsystem-test.baseUrl=https://earlybird-team5.duckdns.org
