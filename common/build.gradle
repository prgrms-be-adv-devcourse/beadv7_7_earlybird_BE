plugins {
    id 'java-library'   // Boot 플러그인 없음. 이 모듈은 '부품'이지 '앱'이 아니다.
}

dependencies {
    // GlobalExceptionHandler(@RestControllerAdvice)와 ApiResponse(Jackson)가 웹 스택을 쓴다.
    // implementation: 모든 기존 서비스 모듈이 이미 자기 build.gradle에 각자 선언하고 있어
    // 전파가 필요 없다 — gateway-server(WebFlux, DB 없음)가 common에 의존해도
    // webmvc/data-jpa를 함께 끌고 오지 않도록 여기서는 전파하지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Bean Validation(@Valid, @NotNull 등). order-service 등 일부 서비스는 자기 build.gradle 에
    // 직접 선언하지 않고 이 api 전파에 의존하고 있어 webmvc/data-jpa 와 달리 되돌릴 수 없다.
    // (gateway-server 는 자기 build.gradle 에서 이 모듈을 명시적으로 exclude 하므로 영향 없다.)
    api 'org.springframework.boot:spring-boot-starter-validation'
    // BaseEntity(JPA Auditing)가 MappedSuperclass(jakarta.persistence)/AuditingEntityListener(spring-data-jpa)를
    // 쓴다 - 이 둘만 필요하므로 Hibernate/HikariCP/자동설정 트리거까지 함께 묶인 Boot "starter"
    // 대신 순수 라이브러리만 의존한다. DB를 실제로 쓰는 서비스는 이미 각자 build.gradle에
    // spring-boot-starter-data-jpa를 직접 선언해두고 있어(redundant) 영향 없음 - DB가 없는
    // 서비스(ai-service, gateway-server)만 이걸로 자동설정 오작동을 피한다.
    implementation 'org.springframework.data:spring-data-jpa'
    // spring-data-jpa는 jakarta.persistence-api를 compileOnly로만 갖고 있어(실제 구현체는
    // 각 앱의 starter가 채워줄 걸 전제) common 자신의 @MappedSuperclass/@EntityListeners 컴파일에
    // 필요한 만큼 직접 선언한다.
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // KafkaErrorHandlingConfig가 KafkaTemplate/DeadLetterPublishingRecoverer 타입을 참조한다.
    // compileOnly: implementation으로 넣으면 spring-kafka가 board/user/file/notification-service의
    // runtime classpath에도 전파되어, 그 서비스들에서도 @ConditionalOnClass(KafkaTemplate.class) 조건이
    // (spring-kafka가 있으니) true가 되어버려 가드가 무력화된다. kafka를 쓰는 5개 서비스는 이미
    // 자기 build.gradle에 spring-kafka를 직접 선언해뒀으니(6번 작업) compileOnly로도 런타임엔 문제없다.
    compileOnly 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
