# 테스트 전용 설정 — @SpringBootTest 통합 테스트는 config-server 없이 독립 실행돼야 한다.
# (test/resources 의 application.yml 이 main 의 것을 덮어쓰므로 여기서 자립적으로 채운다.)
spring:
  application:
    name: project-service
  cloud:
    config:
      # 테스트에선 config-server 에 접속하지 않는다.
      enabled: false
      import-check:
        enabled: false
  # datasource 는 각 테스트의 Testcontainers MySQL(@ServiceConnection)이 공급한다.
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
  # 이 리포의 통합 테스트는 브로커 없이 돈다 — ProjectClosedEventListener가 커밋 후 Kafka로
  # 발행하는데, max.block.ms 기본값(60000)이면 브로커 부재 시 그 시간만큼 백그라운드 스레드가
  # 블로킹된다(@EnableAsync라 테스트 assertion 자체는 안 물리지만, 리소스 낭비/로그 노이즈는 남는다).
  # 운영 config-repo(beadv7_7_earlybird_config)의 project-service.yml에도 짧은 값을 넣어야
  # 브로커 장애 시 마감 배치가 프로젝트 1개당 60초씩 물리는 걸 막는다 — 이 리포에서는 그 리포를
  # 직접 수정할 수 없다.
  kafka:
    producer:
      properties:
        max.block.ms: 3000
  ai:
    openai:
      api-key: test-key-not-a-real-key
    # Spring AI EmbeddingModel(OpenAiEmbeddingModel)의 내부 RetryTemplate 기본값은
    # max-attempts=10, backoff.initial-interval=2s, multiplier=5, max-interval=180s다 — 최악의 경우
    # 재시도만으로 서킷브레이커 타임아웃(ProjectSearchCircuitBreakerConfig의 10초)을 훨씬 초과할 수
    # 있다. 그러면 호출자는 이미 503을 받은 뒤인데 재시도는 별개 스레드에서 계속 도는 낭비가 생기고,
    # 그 재시도가 성공해도 이미 실패 처리된 호출자에게는 아무 도움이 안 된다. 그래서 낮게 잡는다
    # (운영 config-repo(beadv7_7_earlybird_config)의 project-service.yml에도 이 값을 동일하게
    # 추가해야 한다 — 이 리포에서는 그 리포를 직접 수정할 수 없다).
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 200ms

# 테스트에선 Eureka 등록/조회를 시도하지 않는다 (명부 서버가 떠 있지 않음).
eureka:
  client:
    enabled: false
