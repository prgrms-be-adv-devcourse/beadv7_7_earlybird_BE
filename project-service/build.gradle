plugins {
    id 'org.springframework.boot'   // 실행 가능한 서비스이므로 Boot 플러그인 적용 (버전은 루트에 등록됨)
}

dependencyManagement {
    imports {
        // Spring AI(OpenAI 임베딩)는 프로젝트 전체가 아니라 project-service만 쓰므로 루트가 아니라
        // 여기서 BOM을 받는다. 1.0.0(Task 1이 처음 넣은 버전)은 Boot 3.x 시절 FQCN인
        // org.springframework.boot.autoconfigure.web.client.RestClientAutoConfiguration을
        // @AutoConfiguration(after=...)에 클래스 리터럴로 박아놨는데, Boot 4.1에서 그 클래스가
        // org.springframework.boot.restclient.autoconfigure.RestClientAutoConfiguration로 패키지가
        // 옮겨지면서(자동설정 모듈 분리) 컨텍스트 기동 시 TypeNotPresentException → ClassNotFoundException으로
        // 죽는다. 2.0.0 GA는 그 after 참조를 걷어내 Boot 4.x와 호환된다(spring-autoconfigure-metadata.properties
        // 확인 결과 OpenAiEmbeddingAutoConfiguration의 AutoConfigureAfter가 비어 있음).
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.0'
    }
}

dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // spring-kafka만 넣으면 클라이언트 라이브러리만 딸려오고 KafkaAutoConfiguration(KafkaTemplate
    // 자동 생성 등)은 안 붙는다 — Boot 4에서 자동설정이 spring-boot-kafka로 분리되어, 그걸 묶어주는
    // 이 스타터를 써야 한다.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'

    // 선언적 HTTP 클라이언트 — 인터페이스를 선언하면 구현체(프록시)가 생긴다.
    // 이 스타터가 로드밸런서(spring-cloud-starter-loadbalancer)도 함께 끌고 온다.
    // 버전이 없어도 되는 이유: 늘 그랬듯 Spring Cloud BOM 이 채워준다.
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // 실제 동시성(낙관적 락) 재현 테스트용 — 진짜 MySQL이 필요하다 (Docker)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 서킷 브레이커 — Spring Cloud 추상화 + Resilience4j 구현체 세트.
    // 버전이 없어도 되는 이유: Spring Cloud BOM 이 채워준다.
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // Reward 낙관적 락(@Version) 충돌 시 재시도용. @Retryable은 spring-aspects(AOP)가 있어야 동작한다.
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Swagger UI(/swagger-ui.html) + OpenAPI 3 문서(/v3/api-docs) 자동 생성.
    // Spring Boot BOM 이 버전을 관리하지 않아 직접 명시한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // 프로젝트 키워드 검색(nori) — 프레임워크 기본 통합(ElasticsearchOperations) 사용, 커스텀 HTTP 클라이언트 없음.
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // 실제 nori가 포함된 ES(로컬 infrastructure/elasticsearch/Dockerfile과 동일 이미지)로 색인/검색을 검증.
    testImplementation 'org.testcontainers:elasticsearch'

    // OpenAI 임베딩 — 커스텀 HTTP 클라이언트 대신 Spring AI의 EmbeddingModel 추상화를 쓴다.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // 색인 후 ES refresh_interval(최대 1초) 지연을 기다리는 통합 테스트용.
    testImplementation 'org.awaitility:awaitility'
}
