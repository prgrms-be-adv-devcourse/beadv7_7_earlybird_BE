spring.application.name=discovery-server
server.port=8761

# discovery-server는 config-server를 import하지 않으므로 공유 config repo에 이 값을 넣어도
# 적용되지 않는다 - 여기 로컬에 직접 정의한다 (#69).
spring.threads.virtual.enabled=true

# Eureka Server ? Eureka Client ?????? ?? ?? ?? (?? ???? ??? ???? ??).
# ??? ?? 1????? "?? ???? ??/??"??? ?? ??? ???.
# ?????? ?? ???? ?? ? ??? ??.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# discovery-server는 config-server를 import하지 않으므로 공유 config repo의 logging.*
# 설정이 적용되지 않는다 - 여기 로컬에 별도로 정의해야 한다.
logging.file.name=./logs/${spring.application.name}.log
logging.logback.rollingpolicy.file-name-pattern=./logs/${spring.application.name}.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
