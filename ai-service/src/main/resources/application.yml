spring:
  application:
    name: ai-service
  cloud:
    config:
      # optional: 을 쓰지 않는다 — fetch 실패를 조용히 무시하고 스프링 기본값(엉뚱한 포트 등)으로
      # 뜨는 대신, 아래 fail-fast+retry 로 재시도하다가 그래도 안 되면 기동 자체를 실패시킨다 (#192).
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 3000
        multiplier: 1.5
        max-interval: 10000
---
# 프로필별로 문서를 분리하는 이유는 gateway-server/application.yml 참고 — spring.config.import 를
# env var 로 통째로 덮어쓰면 이 파일의 import 와 별개로 취급돼 둘 다 처리되는 문제가 있었다.
spring:
  config:
    activate:
      on-profile: '!docker'
    import: configserver:http://localhost:8888
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
---
# k8s 클러스터(데이터 박스)에서 실행되는 pod는 docker-compose 네트워크의 config-server
# 호스트명을 못 쓴다 — 앱 박스가 8888을 호스트에 publish해둔 것을 데이터 박스에서
# 앱 박스의 private IP로 직접 접근 (SG: 데이터 박스 -> 앱 박스 8888 inbound 필요).
spring:
  config:
    activate:
      on-profile: k8s
    import: configserver:http://10.0.0.81:8888
