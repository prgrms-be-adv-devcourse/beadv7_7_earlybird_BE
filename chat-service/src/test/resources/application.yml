# 테스트 전용 설정 - @SpringBootTest 통합 테스ㅌ는 config-server/discovery-server 없이 독립 실행되어야 한다.
spring:
  application:
    name: chat-service
  # 운영과 동일하게 virtual thread를 켠 채로 테스트를 돌려야 pinning 같은 문제를 여기서 잡는다 (#69).
  threads:
    virtual:
      enabled: true
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  ai:
    openai:
      api-key: test-key-not-a-real-key
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 200ms

eureka:
  client:
    enabled: false
