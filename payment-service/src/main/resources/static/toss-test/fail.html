<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패</title>
  <style>body { max-width: 560px; margin: 48px auto; padding: 0 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #191f28; } pre { padding: 16px; border-radius: 8px; background: #f2f4f6; white-space: pre-wrap; } a { color: #3182f6; }</style>
</head>
<body>
  <h1>결제가 완료되지 않았습니다.</h1>
  <p id="message"></p>
  <pre id="details"></pre>
  <p><a href="/toss-test/">다시 시도하기</a></p>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('message').textContent = params.get('message') || '결제 과정이 취소되었거나 실패했습니다.';
    document.getElementById('details').textContent = JSON.stringify(Object.fromEntries(params), null, 2);
  </script>
</body>
</html>
