# 테스트 전용 설정 — @WebMvcTest 등 슬라이스 테스트도 config-server 없이 독립 실행돼야 한다.
# (test/resources 의 application.yml 이 main 의 것을 덮어쓰므로 여기서 자립적으로 채운다.)
spring:
  application:
    name: order-service
  # 운영과 동일하게 virtual thread를 켠 채로 테스트를 돌려야 JDBC pinning 같은 문제를 여기서 잡는다 (#69).
  threads:
    virtual:
      enabled: true
  cloud:
    config:
      # 테스트에선 config-server 에 접속하지 않는다.
      enabled: false
      import-check:
        enabled: false

# 테스트에선 Eureka 등록/조회를 시도하지 않는다 (명부 서버가 떠 있지 않음).
eureka:
  client:
    enabled: false
