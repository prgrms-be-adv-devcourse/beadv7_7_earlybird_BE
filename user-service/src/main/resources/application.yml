# 로컬에는 "금고 열쇠"만 남긴다 — 나머지 설정은 config-server 가 배달한다.
spring:
  application:
    name: user-service          # config-server 에서 내 설정 파일(user-service.yml)을 찾는 열쇠
  cloud:
    config:
      # optional: 을 쓰지 않는다 — fetch 실패를 조용히 무시하고 스프링 기본값(엉뚱한 포트 등)으로
      # 뜨는 대신, 아래 fail-fast+retry 로 재시도하다가 그래도 안 되면 기동 자체를 실패시킨다 (#192).
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 3000
        multiplier: 1.5
        max-interval: 10000
---
# 프로필별로 문서를 분리하는 이유는 gateway-server/application.yml 참고 — spring.config.import 를
# env var 로 통째로 덮어쓰면 이 파일의 import 와 별개로 취급돼 둘 다 처리되는 문제가 있었다.
# '!docker' 단독으로는 k8s 프로필도 매칭되어 이 블록과 k8s 블록이 동시에 활성화되고
# localhost:8888 쪽이 실패해 fail-fast로 죽는다 - 이미 겪은 함정이라 처음부터 명시적으로 제외.
spring:
  config:
    activate:
      on-profile: '!docker & !k8s'
    import: configserver:http://localhost:8888
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
---
spring:
  config:
    activate:
      on-profile: k8s
    import: configserver:http://config-server:8888
