# 테스트 전용 설정 — @SpringBootTest 통합 테스트는 config-server/discovery-server 없이 독립 실행돼야 한다.
# (test/resources 의 application.yml 이 main 의 것을 덮어쓰므로 여기서 자립적으로 채운다.)
spring:
  application:
    name: gateway-server
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

# 테스트에선 Eureka 등록/조회를 시도하지 않는다 (명부 서버가 떠 있지 않음).
eureka:
  client:
    enabled: false

